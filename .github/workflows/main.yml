
name: This is test CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check the code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          test -n "$EC2_SSH_KEY" || { echo "EC2_SSH_KEY secret is required"; exit 1; }
          test -n "$EC2_HOST" || { echo "EC2_HOST secret is required"; exit 1; }
          test -n "$EC2_USER" || { echo "EC2_USER secret is required"; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/ec2_deploy_key"
          chmod 600 "$HOME/.ssh/ec2_deploy_key"
          ssh-keyscan -H -T 10 "$EC2_HOST" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts" || { echo "Could not retrieve EC2 SSH host keys"; exit 1; }
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Package website
        run: |
          tar -czf site.tar.gz -- ./*.html ./assets ./images

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i "$HOME/.ssh/ec2_deploy_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            site.tar.gz "$EC2_USER@$EC2_HOST:/tmp/nginx-site-${GITHUB_SHA}.tar.gz"

          ssh -i "$HOME/.ssh/ec2_deploy_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          archive="/tmp/nginx-site-$1.tar.gz"

          if ! command -v nginx >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y nginx
          fi

          sudo systemctl enable --now nginx
          sudo tar -xzf "$archive" -C /var/www/html --no-same-owner
          sudo rm -f "$archive"
          curl --fail --silent --show-error http://localhost/ | grep -q "ZeroFour by HTML5 UP"
          REMOTE
